# Triton Inference Server serving the mixed-precision TensorRT engines.
#
# Same shape as triton-server-deployment.yaml but serves .plan engines
# (platform: tensorrt_plan) from a SEPARATE S3 model repo, for ~2.5-3x the
# ONNX/ORT throughput (measured on Blackwell: affect 1539 / disfluency 1742 /
# emotion 3003 win/s at batch 128 — vs ORT 588 / 705 / 977).
#
# *** HARD CONSTRAINT: the engines are architecture + TRT-version locked. ***
# They were built on the Blackwell RTX PRO 6000 (sm_120) with TensorRT 10.11.0.33
# (scripts/build_trt_engine.py, from fold-constant'd ONNX). They ONLY load on:
#   - a Blackwell sm_120 GPU (the g7e nodeSelector below), AND
#   - the tritonserver:25.07-py3 image (TRT 10.11.0.33). If you bump the image, the
#     TRT version changes and the engines won't deserialize — rebuild them.
#
# Models: s3://riverside-build-assets/paralinguistics-trt/GB202/{affect,disfluency,emotion}/1/model.plan
# Publish:  aws s3 sync /efs/arno/triton-trt-repo s3://riverside-build-assets/paralinguistics-trt/GB202
# Apply:    kubectl apply -f manifests/triton-trt-deployment.yaml -n nlp-audio-understanding
# Workers reach it at:  triton-trt.nlp-audio-understanding:8001 (gRPC) / :8000 (HTTP)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton-trt
  namespace: nlp-audio-understanding
  labels:
    app: triton-trt
    team: nlp
    project: audio-understanding
spec:
  # N replicas = N Blackwell GPUs, each running the full trio. The ClusterIP
  # Service spreads the CPU backfill workers' gRPC connections across them
  # (connection-level LB — fine for a many-worker fleet). Karpenter provisions
  # one g7e.2xlarge per replica. With the pipelined+overlapped workers (~4-5
  # workers saturate one TRT GPU), 60 CPU pods feed ~12 GPUs — see the template.
  # NOTE: 12 g7e.2xlarge (Blackwell) is significant capacity; some replicas may sit
  # Pending if the EFA GPU pool is short. The Service LBs across whatever is Ready,
  # so the fleet still runs on the available subset — don't block on all 12.
  replicas: 12
  selector:
    matchLabels:
      app: triton-trt
  template:
    metadata:
      labels:
        app: triton-trt
    spec:
      tolerations:
        - key: karpenter
          operator: Equal
          value: ai-workers-gpu
          effect: NoSchedule
        # g7e Blackwell capacity is in the EFA GPU nodepool — tolerate its taints
        # too, or pods sit Pending once the plain ai-workers-gpu pool has no g7e.
        - key: karpenter
          operator: Equal
          value: ai-workers-gpu-efa
          effect: NoSchedule
        - key: efa
          operator: Equal
          value: "true"
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        # Blackwell sm_120 — REQUIRED, the .plan engines are built for this arch.
        node.kubernetes.io/instance-type: g7e.2xlarge

      # IRSA credentials for S3 model-repository access (same SA as the ONNX
      # server). Without this, Triton fails at startup: "Unable to create S3
      # filesystem client. Check account credentials." The role can read
      # s3://riverside-build-assets/paralinguistics-trt/*.
      serviceAccountName: ai-dev-common-access

      containers:
        - name: tritonserver
          # MUST be the image the engines were built against (TRT 10.11.0.33).
          image: nvcr.io/nvidia/tritonserver:25.07-py3
          imagePullPolicy: Always
          command:
            - tritonserver
          args:
            - --model-repository=s3://riverside-build-assets/paralinguistics-trt/GB202
            - --log-verbose=1
            - --grpc-port=8001
            - --http-port=8000
            - --metrics-port=8002
            - --allow-grpc=true
            - --allow-http=true
            - --model-control-mode=none

          ports:
            - containerPort: 8000
              name: http
            - containerPort: 8001
              name: grpc
            - containerPort: 8002
              name: metrics

          resources:
            requests:
              cpu: "6"
              memory: "32Gi"
              nvidia.com/gpu: "1"
              # ~1.6 GB of .plan localised from S3 + TRT runtime scratch.
              ephemeral-storage: "6Gi"
            limits:
              cpu: "8"
              memory: "48Gi"
              nvidia.com/gpu: "1"
              ephemeral-storage: "10Gi"

          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1

          volumeMounts:
            - name: dshm
              mountPath: /dev/shm

          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 20
            failureThreshold: 6

      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi

---
# ClusterIP service — kept for HTTP health checks, metrics scraping, and any
# non-gRPC access. Workers do NOT use this for inference (see headless service).
apiVersion: v1
kind: Service
metadata:
  name: triton-trt
  namespace: nlp-audio-understanding
  labels:
    app: triton-trt
spec:
  selector:
    app: triton-trt
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: grpc
      port: 8001
      targetPort: 8001
    - name: metrics
      port: 8002
      targetPort: 8002
---
# Headless service for gRPC client-side load balancing.
# ClusterIP: None makes Kubernetes DNS return one A record per ready pod.
# Workers connect to this with round_robin LB policy so requests are
# distributed across all replicas at the RPC level (not connection level),
# and new pods are discovered automatically within ~30s of becoming Ready.
apiVersion: v1
kind: Service
metadata:
  name: triton-trt-headless
  namespace: nlp-audio-understanding
  labels:
    app: triton-trt
spec:
  selector:
    app: triton-trt
  clusterIP: None
  ports:
    - name: grpc
      port: 8001
      targetPort: 8001
