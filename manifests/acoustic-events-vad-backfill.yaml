# One-shot CPU VAD backfill over the whole corpus.
#
# Purpose: populate the vad/ artifact for every archive so the GPU fleet can run
# VAD-gated (today ~89% of archives have no VAD, so the GPU fleet runs full-timeline
# and gets ZERO gating speedup). This differs from acoustic-events-inference-vad-cpu.yaml
# (the steady-state LEADING fleet) in that each pod LOOPS until it finds no more VAD
# work to claim, then exits 0 — so the k8s jobs complete when the corpus is covered.
#
# Throughput note: VAD (Silero, via torch) is a per-30 ms-window Python loop — CPU-bound,
# ~one core per worker process. Parallelism comes from running VAD_PROCS worker PROCESSES
# (scripts/run_vad_multiproc.sh), each claiming distinct archives. TWO things must hold or
# the pod oversubscribes and OOMs (as the first 20-pod run did — backoffLimit, Job Failed):
#   1. Pin each worker to ONE math thread. torch/OMP/MKL/BLAS default their intra-op pools
#      to ALL cores, so N processes each fanning across every core = N×N contention and ~5x
#      slower VAD. run_vad_multiproc.sh now exports OMP_NUM_THREADS=1 etc. to prevent this.
#   2. Keep decode cheap. Decode runs in a separate GIL-releasing thread (~12s vs VAD ~70s),
#      so PREFETCH_WORKERS=1 + a small lookahead is plenty; a big lookahead pins a 2nd core
#      per proc AND holds several ~250MB decoded archives resident => OOM at the 24Gi limit.
# With VAD_PROCS=8 (one VAD core each) a single validation pod measured ~660 arc/h (8 hot
# threads, ~19GB RSS — well under the 24Gi limit); 20 pods ≈ ~13k/h => the ~526k backlog in
# ~1.5-2 days. Rate varies with archive length (longer recordings → fewer/h). Do NOT trust
# the dashboard Pace for VAD; track real progress with `orchestration progress --fast`.
#
# Workers coordinate via per-archive locks + --completion-policy exists, so the 20 pods
# never double-process, and a pod that finds everything claimed/done exits cleanly.
#
# Topology: this is ONE k8s Job running 20 identical pods (parallelism/completions in
# the parallel template below), NOT 20 separate Jobs. Pod count lives in the template,
# not in grid: (which stays at a single entry). Bump parallelism/completions there.
# Launch:  experiment-launcher launch manifests/acoustic-events-vad-backfill.yaml \
#            --template ./manifests/job-template-vad-backfill-parallel.yaml
config:
  namespace: nlp-audio-understanding
  team: nlp
  project: audio-understanding
  image: 690765672468.dkr.ecr.us-east-1.amazonaws.com/ai-content-provenance:latest
  capacityType: on-demand
  ephemeralStorage: "10Gi"
  instanceTypes: ["c6a.4xlarge", "c7a.4xlarge", "c6i.4xlarge", "c7i.4xlarge"]
  env:
    CLEARML_WEB_HOST: http://clearml-webserver.clearml:8080
    CLEARML_API_HOST: http://clearml-apiserver.clearml:8008
    CLEARML_FILES_HOST: https://clearml-fileserver.ai-dev.riverside.fm
    RS_OWNER: dvirbenor
  ebs:
    enabled: true
    size: 50Gi
    persistent: false
    mountPath: /workspace
  s3Access:
    enabled: true

experiments:
  - name: vad-backfill
    category: inference
    description: One-shot CPU VAD backfill — loops until no VAD work remains, then exits
    resources:
      requests:
        cpu: "13"
        memory: "24Gi"
      limits:
        cpu: "13"
        memory: "24Gi"
    cmd: /bin/bash
    args:
      - -lc
      - |
        set -euo pipefail

        export RUN_ID="{run_id}"
        export PYTHONUNBUFFERED=1
        export UV_LINK_MODE=copy

        PARQUET="/efs/dvir/data/magic-clips-research/dataset-reference/all_archives.parquet"
        OUTPUT="/efs/dvir/data/magic-clips-research/acoustic-understanding/models-inference"
        LOG_DIR="${OUTPUT}/job-logs"
        mkdir -p "$LOG_DIR"
        LOG_FILE="$LOG_DIR/vad-backfill-run-${RUN_ID}-${HOSTNAME:-unknown}.log"
        exec > >(tee -a "$LOG_FILE") 2>&1

        echo "[$(date -Iseconds)] Starting vad-backfill run ${RUN_ID}"
        cd /workspace

        mkdir -p /workspace/.ssh
        cp /mnt/github-ssh/id_ed25519 /workspace/.ssh/id_ed25519
        cp /mnt/github-ssh/known_hosts /workspace/.ssh/known_hosts
        chmod 700 /workspace/.ssh
        chmod 400 /workspace/.ssh/id_ed25519
        chmod 444 /workspace/.ssh/known_hosts
        export GIT_SSH_COMMAND="ssh -i /workspace/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/workspace/.ssh/known_hosts"

        rm -rf audio-classification-playground
        git clone --branch feature/inference-optimization --single-branch git@github.com:dvirbenor/audio-classification-playground.git
        cd audio-classification-playground
        echo "Git commit: $(git rev-parse HEAD)"
        uv sync --frozen
        source .venv/bin/activate
        source env.shared.sh

        # Loop the multi-process VAD launcher until a pass processes zero archives (the
        # fleet has covered the corpus). Each pass runs VAD_PROCS worker processes (one
        # per physical core), each doing one pass over the manifest and skipping
        # already-done/locked archives; we re-scan to mop up anything freed by a peer
        # that died mid-archive. A non-clean pass (a proc crashed / missing finish line,
        # launcher reports clean=0) is retried after a short backoff, not mistaken for
        # completion.
        set +e
        PASS=0
        while true; do
          PASS=$((PASS + 1))
          echo "[$(date -Iseconds)] === VAD backfill pass ${PASS} ==="
          PASS_LOG="$(mktemp)"
          # VAD_PROCS=8 → one single-threaded VAD process per physical core (8 on these
          # 16-vCPU/8-physical 4xlarges); run_vad_multiproc.sh pins OMP/MKL/BLAS=1 so the
          # procs don't fan torch across all cores. PREFETCH_WORKERS=1 + small lookahead:
          # decode (~12s) is far cheaper than VAD (~70s), so one bursty decode thread per
          # proc keeps archives ready without pinning a 2nd core or holding many ~250MB
          # decoded buffers resident (the prior 2×lookahead=4 config OOM'd the 24Gi limit).
          VAD_PROCS=8 \
          PREFETCH_WORKERS=1 \
          PREFETCH_LOOKAHEAD=2 \
          VAD_PREFETCH_WORKERS=1 \
          PARQUET="$PARQUET" \
          OUTPUT="$OUTPUT" \
          bash scripts/run_vad_multiproc.sh 2>&1 | tee "$PASS_LOG"

          RESULT="$(grep -oE 'VAD_MULTIPROC total_processed=[0-9]+ clean=[01]' "$PASS_LOG" | tail -1)"
          if [ -z "$RESULT" ]; then
            echo "[$(date -Iseconds)] pass ${PASS}: no result line (crash?) — retrying in 30s"
            sleep 30
            continue
          fi
          PROC="$(echo "$RESULT" | grep -oE 'total_processed=[0-9]+' | grep -oE '[0-9]+')"
          CLEAN="$(echo "$RESULT" | grep -oE 'clean=[01]' | grep -oE '[01]')"
          echo "[$(date -Iseconds)] pass ${PASS}: processed=${PROC:-0} clean=${CLEAN:-0}"
          if [ "${CLEAN:-0}" -ne 1 ]; then
            echo "[$(date -Iseconds)] pass ${PASS}: a worker crashed — retrying in 30s"
            sleep 30
            continue
          fi
          if [ "${PROC:-0}" -eq 0 ]; then
            echo "[$(date -Iseconds)] No VAD work processed — corpus covered. Exiting 0."
            break
          fi
        done
        echo "[$(date -Iseconds)] Finished vad-backfill run ${RUN_ID}"
    # Pod count is set by parallelism/completions in the parallel template, NOT here.
    # Keep this at a single entry so the launcher emits ONE Job (the template then
    # runs N pods under it). To change pod count, edit parallelism/completions in
    # manifests/job-template-vad-backfill-parallel.yaml.
    grid:
      run_id: [1]
