# Self-contained inference on g5.8xlarge: local Triton sidecar + CPU workers.
#
# WHY THIS REPLACES acoustic-events-triton-backfill.yaml
# -------------------------------------------------------
# The original setup shipped audio window embeddings from CPU pods to a REMOTE
# Triton server over gRPC, generating enormous cross-node (and cross-AZ) network
# traffic. This manifest eliminates that entirely: Triton runs as a SIDECAR in
# the same pod. Containers in one pod share the host network, so gRPC goes over
# localhost — essentially free.
#
# WHY NOT MPS CO-LOCATION (see acoustic-events-inference-mps-colocated-blackwell.yaml)
# ---------------------------------------------------------------------------------
# MPS co-location loads three separate model copies (affect + disfluency + emotion)
# into VRAM via three independent Python processes. On a 24 GB A10G that is tight
# and leaves no headroom. Triton loads each model ONCE and multiplexes all worker
# requests through a single copy, using ~3-4 GB VRAM total and keeping the
# remaining 20 GB as breathing room.
# NOTE: paralinguistics-trt/A10G contains TRT .plan engines built for sm_86 (A10G),
# not ONNX as the older triton-a10g-deployment.yaml comment suggests — TRT
# throughput applies here, not the slower ONNX/ORT baseline.
#
# Per-pod layout (g5.8xlarge: 32 vCPU, 128 GB RAM, 1 × A10G 24 GB):
#
#   [triton-sidecar]         ~6 CPU  20 Gi  1 A10G
#     tritonserver ONNX/ORT — affect + disfluency + emotion
#     loaded from s3://riverside-build-assets/paralinguistics-trt/A10G
#     serves gRPC on localhost:8001, batches across all in-flight worker requests
#
#   [experiment-container]  ~24 CPU  40 Gi  no GPU
#     orchestration worker, --device cpu --triton-url localhost:8001
#     same code path as the original triton backfill, target changed to localhost
#     heavy prefetch (24 workers) keeps the in-flight gRPC queue deep enough to
#     let Triton form batches
#
# PREREQUISITES:
#   - NO separate Triton Deployment — the sidecar IS the server.
#   - VAD already computed; worker gates on --require-precomputed-vad.
#   - Pre-built worklist at $OUTPUT/_meta/needs_work.txt (same as triton backfill).
#     Build with: python -m ...orchestration build-worklist --output $OUTPUT ...
#
# Launch (single Indexed Job, N pods):
#   experiment-launcher launch manifests/acoustic-events-g5-colocated.yaml \
#       --template ./manifests/job-template-g5-triton-local-parallel.yaml
#
# Keep grid.run_id at [1] when using that template — pod count is
# parallelism/completions there. SHARD_COUNT below MUST equal that number.
config:
  namespace: nlp-audio-understanding
  team: nlp
  project: audio-understanding
  # CPU image — workers run --device cpu, all GPU work goes to the Triton sidecar.
  image: 690765672468.dkr.ecr.us-east-1.amazonaws.com/ml-dev-containers:cpu-1.0.6
  capacityType: on-demand
  env:
    CLEARML_WEB_HOST: http://clearml-webserver.clearml:8080
    CLEARML_API_HOST: http://clearml-apiserver.clearml:8008
    CLEARML_FILES_HOST: https://clearml-fileserver.ai-dev.riverside.fm
    RS_OWNER: dvirbenor
  ebs:
    enabled: false
  s3Access:
    enabled: true

experiments:
  - name: g5-triton-local-models
    category: inference
    description: >
      CPU workers + co-located Triton sidecar (ONNX/A10G) on g5.8xlarge.
      Workers send gRPC to localhost:8001 — no cross-node network.
      Task-group "models" (affect + disfluency + emotion), gated on precomputed VAD.
    resources:
      requests:
        # Worker container only. Triton sidecar (~6 CPU, 20 Gi, 1 GPU) is declared
        # in job-template-g5-triton-local-parallel.yaml.
        cpu: "24"
        memory: "40Gi"
      limits:
        cpu: "26"
        memory: "48Gi"
    cmd: /bin/bash
    args:
      - -lc
      - |
        set -euo pipefail

        export RUN_ID="{run_id}"
        export PYTHONUNBUFFERED=1
        export UV_LINK_MODE=copy

        export PARQUET="/efs/dvir/data/magic-clips-research/dataset-reference/all_archives.parquet"
        export OUTPUT="/efs/dvir/data/magic-clips-research/acoustic-understanding/models-inference"
        export AUDIO_CACHE="${OUTPUT}/_meta/audio_cache"
        export CACHE_BYTES=536870912000

        # SHARD_COUNT MUST match parallelism/completions in job-template-g5-triton-local-parallel.yaml.
        export SHARD_COUNT=5
        export TRITON_URL="localhost:8001"

        LOG_DIR="${OUTPUT}/job-logs"
        mkdir -p "$LOG_DIR"
        LOG_FILE="$LOG_DIR/g5-triton-local-${RUN_ID}-${HOSTNAME:-unknown}.log"
        exec > >(tee -a "$LOG_FILE") 2>&1

        echo "[$(date -Iseconds)] Starting g5-triton-local run ${RUN_ID} on ${HOSTNAME:-unknown}"

        mkdir -p /tmp/workspace/.ssh
        cp /mnt/github-ssh/id_ed25519 /tmp/workspace/.ssh/id_ed25519
        cp /mnt/github-ssh/known_hosts /tmp/workspace/.ssh/known_hosts
        chmod 700 /tmp/workspace/.ssh
        chmod 400 /tmp/workspace/.ssh/id_ed25519
        chmod 444 /tmp/workspace/.ssh/known_hosts
        export GIT_SSH_COMMAND="ssh -i /tmp/workspace/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/workspace/.ssh/known_hosts"

        cd /tmp/workspace
        rm -rf audio-classification-playground
        git clone --branch feature/inference-optimization --single-branch \
            git@github.com:dvirbenor/audio-classification-playground.git
        cd audio-classification-playground
        echo "Git commit: $(git rev-parse HEAD)"
        uv sync --frozen
        source .venv/bin/activate

        # Wait for the Triton sidecar to finish loading models from S3.
        # ONNX/ORT models on A10G typically ready in 60-120s; allow up to 300s.
        echo "[$(date -Iseconds)] Waiting for Triton sidecar at ${TRITON_URL} …"
        for i in $(seq 1 30); do
          if curl -sf "http://localhost:8000/v2/health/ready" >/dev/null 2>&1; then
            echo "[$(date -Iseconds)] Triton ready (attempt ${i})"
            break
          fi
          [ "$i" -eq 30 ] && { echo "ERROR: Triton not ready after 300s"; exit 1; }
          sleep 10
        done

        # Confirm models loaded correctly and report their names.
        python - <<'PYEOF'
        import tritonclient.grpc as grpcclient, os, sys
        url = os.environ["TRITON_URL"]
        try:
            c = grpcclient.InferenceServerClient(url=url, verbose=False)
            models = [m.name for m in c.get_model_repository_index().models]
            print(f"Triton ready at {url}. Models: {models}")
        except Exception as e:
            print(f"ERROR: cannot reach Triton at {url}: {e}", file=sys.stderr)
            sys.exit(1)
        PYEOF

        # task-group "models" = affect + disfluency + emotion, no vad recompute.
        # --device cpu: all GPU work delegated to local Triton sidecar via gRPC.
        # prefetch-workers 24: keep a deep queue of in-flight gRPC requests so
        # Triton's dynamic batcher can form large batches from concurrent requests.
        python -m audio_classification_playground.acoustic_events.orchestration run \
          --parquet "$PARQUET" \
          --output "$OUTPUT" \
          --task-group models \
          --affect-backbone wavlm \
          --disfluency-backbone wavlm \
          --completion-policy exists \
          --device cpu \
          --triton-url "$TRITON_URL" \
          --hop-sec 0.5 \
          --vad-gating \
          --require-precomputed-vad \
          --worklist "$OUTPUT/_meta/needs_work.txt" \
          --shard-index "${JOB_COMPLETION_INDEX:-0}" \
          --shard-count "$SHARD_COUNT" \
          --prefetch-workers 24 \
          --prefetch-lookahead 32 \
          --preserve-worklist-order \
          --max-retries 3 \
          --audio-cache-dir "$AUDIO_CACHE" \
          --max-cache-bytes "$CACHE_BYTES"

        echo "[$(date -Iseconds)] Finished g5-triton-local run ${RUN_ID}"

    # Single entry — pod count is parallelism/completions in the template.
    grid:
      run_id: [1]
