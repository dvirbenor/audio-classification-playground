# CPU preprocessing fleet for Triton-backed model backfilling.
#
# Each worker is CPU-only: it downloads audio from S3, decodes, segments into
# windows, and sends them to the Triton Inference Server over gRPC, which
# batches across workers and runs affect/disfluency/emotion on the GPU.
# task-group "models" runs the three model tasks WITHOUT computing VAD; with
# --vad-gating --require-precomputed-vad it gates inference on the EXISTING vad/
# artifacts (a separate VAD fleet ran ahead) — reading the intervals from disk,
# never recomputing — and skips any archive that has no vad/ artifact yet.
#
# This is the preprocessing half. The inference half is the Triton server:
#   manifests/triton-server-deployment.yaml  (reads models from S3).
#
# PREREQUISITES:
#   - Triton server running  (kubectl apply -f manifests/triton-server-deployment.yaml)
#   - FP16 models published to s3://riverside-build-assets/paralinguistics
#     (the server pulls them; nothing needs to be on /efs for the server).
#   - VAD already computed for the archives, under the SAME --output tree
#     (<output>/<session>/<archive>/vad/); archives without vad/ are skipped.
#
# Launch (single Job, N pods — preferred):
#   experiment-launcher launch manifests/acoustic-events-triton-backfill.yaml \
#       --template ./manifests/job-template-triton-workers-parallel.yaml
#
# Pod count is set in the template (parallelism/completions). Keep grid.run_id
# at [1] — workers are interchangeable and coordinate via file locks, so no
# per-pod work sharding is needed. --completion-policy exists makes re-launching
# resumable: archives that already have all three model artifacts are skipped.
config:
  namespace: nlp-audio-understanding
  team: nlp
  project: audio-understanding
  image: 690765672468.dkr.ecr.us-east-1.amazonaws.com/ml-dev-containers:cpu-1.0.6
  capacityType: on-demand
  env:
    CLEARML_WEB_HOST: http://clearml-webserver.clearml:8080
    CLEARML_API_HOST: http://clearml-apiserver.clearml:8008
    CLEARML_FILES_HOST: https://clearml-fileserver.ai-dev.riverside.fm
    RS_OWNER: dvirbenor
  ebs:
    enabled: false
  s3Access:
    enabled: true

experiments:
  - name: triton-backfill-models-gated
    category: inference
    description: >
      CPU preprocessing workers that delegate affect/disfluency/emotion
      inference to the Triton server (triton-inference.nlp-audio-understanding:8001).
      Task-group "models": gated on existing precomputed VAD (no VAD recompute).
      Backfill mode.
    # CPU instances — no GPU; workers are thin Triton clients
    instanceTypes:
      - c7a.4xlarge
      - c7i.4xlarge
    ephemeralStorage: "10Gi"
    resources:
      requests:
        cpu: "13"
        memory: "24Gi"
      limits:
        cpu: "14"
        memory: "28Gi"
    cmd: /bin/bash
    args:
      - -lc
      - |
        set -euo pipefail

        export RUN_ID="{run_id}"
        export PYTHONUNBUFFERED=1
        export UV_LINK_MODE=copy

        export PARQUET="/efs/dvir/data/magic-clips-research/dataset-reference/all_archives.parquet"
        export OUTPUT="/efs/dvir/data/magic-clips-research/acoustic-understanding/models-inference"
        export AUDIO_CACHE="${OUTPUT}/_meta/audio_cache"
        export CACHE_BYTES=536870912000

        # Fleet sharding: each pod owns a disjoint 1/SHARD_COUNT slice of the
        # pre-built worklist (no per-pod EFS scan). SHARD_COUNT MUST equal the
        # template's completions/parallelism; JOB_COMPLETION_INDEX is set per pod
        # by the Indexed Job (completionMode: Indexed in the worker template).
        export SHARD_COUNT=30

        # Triton server address (ClusterIP Service from triton-trt-deployment.yaml).
        # Switched from the ONNX/ORT server (triton-inference) to the TensorRT
        # server (triton-trt) — ~2.5-3x throughput. Both serve max_batch 128.
        export TRITON_URL="triton-trt.nlp-audio-understanding:8001"

        LOG_DIR="${OUTPUT}/job-logs"
        mkdir -p "$LOG_DIR"
        LOG_FILE="$LOG_DIR/triton-backfill-${RUN_ID}-${HOSTNAME:-unknown}.log"
        exec > >(tee -a "$LOG_FILE") 2>&1

        echo "[$(date -Iseconds)] Starting triton-backfill run ${RUN_ID}"

        mkdir -p /tmp/workspace/.ssh
        cp /mnt/github-ssh/id_ed25519 /tmp/workspace/.ssh/id_ed25519
        cp /mnt/github-ssh/known_hosts /tmp/workspace/.ssh/known_hosts
        chmod 700 /tmp/workspace/.ssh
        chmod 400 /tmp/workspace/.ssh/id_ed25519
        chmod 444 /tmp/workspace/.ssh/known_hosts
        export GIT_SSH_COMMAND="ssh -i /tmp/workspace/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/workspace/.ssh/known_hosts"

        cd /tmp/workspace
        rm -rf audio-classification-playground
        git clone --branch feature/inference-optimization --single-branch \
            git@github.com:dvirbenor/audio-classification-playground.git
        cd audio-classification-playground
        echo "Git commit: $(git rev-parse HEAD)"
        uv sync --frozen
        source .venv/bin/activate

        # Verify Triton server is reachable before starting the main loop
        echo "Checking Triton server at ${TRITON_URL} …"
        python - <<'PYEOF'
        import tritonclient.grpc as grpcclient, os, sys
        try:
            c = grpcclient.InferenceServerClient(url=os.environ["TRITON_URL"], verbose=False)
            if not c.is_server_ready():
                print("ERROR: Triton server is not ready", file=sys.stderr)
                sys.exit(1)
            print("Triton server ready. Models:", [m.name for m in c.get_model_repository_index().models])
        except Exception as e:
            print(f"ERROR: cannot reach Triton server: {e}", file=sys.stderr)
            sys.exit(1)
        PYEOF

        # task-group "models" = affect + disfluency + emotion, no vad task (does
        # NOT recompute VAD). --vad-gating + --require-precomputed-vad gate on the
        # existing vad/ artifacts and skip archives without them. --completion-
        # policy exists makes this resumable.
        python -m audio_classification_playground.acoustic_events.orchestration run \
          --parquet "$PARQUET" \
          --output "$OUTPUT" \
          --task-group models \
          --affect-backbone wavlm \
          --disfluency-backbone wavlm \
          --completion-policy exists \
          --device cpu \
          --triton-url "$TRITON_URL" \
          --hop-sec 0.5 \
          --vad-gating \
          --require-precomputed-vad \
          --worklist "$OUTPUT/_meta/needs_work.txt" \
          --shard-index "${JOB_COMPLETION_INDEX:-0}" \
          --shard-count "$SHARD_COUNT" \
          --prefetch-workers 8 \
          --prefetch-lookahead 16 \
          --max-retries 3 \
          --audio-cache-dir "$AUDIO_CACHE" \
          --max-cache-bytes "$CACHE_BYTES"

        echo "[$(date -Iseconds)] Finished triton-backfill run ${RUN_ID}"

    # Single entry — pod count is parallelism/completions in the template.
    grid:
      run_id: [1]
