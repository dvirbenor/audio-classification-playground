# Experimental single-pod Triton server on A10G (sm_86).
#
# Serves TRT .plan engines built for A10G (sm_86) from s3://…/paralinguistics-trt/A10G.
# NOTE: the GB202 engines in paralinguistics-trt/GB202 are sm_120 (Blackwell) locked
# and cannot run here — the A10G path contains a separate set of sm_86 engines.
#
# Apply:   kubectl apply -f manifests/triton-a10g-deployment.yaml -n nlp-audio-understanding
# Delete:  kubectl delete -f manifests/triton-a10g-deployment.yaml -n nlp-audio-understanding
# Workers reach it at:  triton-a10g.nlp-audio-understanding:8001 (gRPC) / :8000 (HTTP)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton-a10g
  namespace: nlp-audio-understanding
  labels:
    app: triton-a10g
    team: nlp
    project: audio-understanding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triton-a10g
  template:
    metadata:
      labels:
        app: triton-a10g
    spec:
      tolerations:
        - key: karpenter
          operator: Equal
          value: ai-workers-gpu
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        node.kubernetes.io/instance-type: g5.2xlarge

      serviceAccountName: ai-dev-common-access

      containers:
        - name: tritonserver
          image: nvcr.io/nvidia/tritonserver:25.07-py3
          imagePullPolicy: Always
          command:
            - tritonserver
          args:
            - --model-repository=s3://riverside-build-assets/paralinguistics-trt/A10G
            - --log-verbose=1
            - --grpc-port=8001
            - --http-port=8000
            - --metrics-port=8002
            - --allow-grpc=true
            - --allow-http=true
            - --model-control-mode=none

          ports:
            - containerPort: 8000
              name: http
            - containerPort: 8001
              name: grpc
            - containerPort: 8002
              name: metrics

          resources:
            requests:
              cpu: "6"
              memory: "20Gi"
              nvidia.com/gpu: "1"
              ephemeral-storage: "4Gi"
            limits:
              cpu: "8"
              memory: "28Gi"
              nvidia.com/gpu: "1"
              ephemeral-storage: "8Gi"

          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1

          volumeMounts:
            - name: dshm
              mountPath: /dev/shm

          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: 8000
            initialDelaySeconds: 240
            periodSeconds: 20
            failureThreshold: 6

      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi

---
apiVersion: v1
kind: Service
metadata:
  name: triton-a10g
  namespace: nlp-audio-understanding
  labels:
    app: triton-a10g
spec:
  selector:
    app: triton-a10g
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: grpc
      port: 8001
      targetPort: 8001
    - name: metrics
      port: 8002
      targetPort: 8002
