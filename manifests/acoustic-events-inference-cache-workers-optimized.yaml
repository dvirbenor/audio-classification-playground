  - name: inference-emotion-cache-vadgated
    category: inference
    description: Run VAD-gated emotion acoustic-event inference on g7e.2xlarge with shared decoded-audio cache
    image: 690765672468.dkr.ecr.us-east-1.amazonaws.com/ml-dev-containers:gpu-1.0.22
    nodeSelector:
      node.kubernetes.io/instance-type: g7e.2xlarge
    cmd: /bin/bash
    args:
      - -lc
      - |
        set -euo pipefail

        export RUN_ID="{run_id}"
        export PYTHONUNBUFFERED=1
        export UV_LINK_MODE=copy
        export TMPDIR=/workspace/tmp
        mkdir -p "$TMPDIR"

        PARQUET="/efs/dvir/data/magic-clips-research/dataset-reference/all_archives.parquet"
        OUTPUT="/efs/dvir/data/magic-clips-research/acoustic-understanding/models-inference"
        AUDIO_CACHE="${OUTPUT}/_meta/audio_cache"
        CACHE_BYTES=536870912000

        LOG_DIR="${OUTPUT}/job-logs"
