        LOG_FILE="$LOG_DIR/inference-emotion-cache-vadgated-run-${RUN_ID}-${HOSTNAME:-unknown}.log"
        exec > >(tee -a "$LOG_FILE") 2>&1

        echo "[$(date -Iseconds)] Starting inference-emotion-cache-vadgated run ${RUN_ID}"
        cd /workspace

        mkdir -p /workspace/.ssh
        cp /mnt/github-ssh/id_ed25519 /workspace/.ssh/id_ed25519
        cp /mnt/github-ssh/known_hosts /workspace/.ssh/known_hosts
        chmod 700 /workspace/.ssh
        chmod 400 /workspace/.ssh/id_ed25519
        chmod 444 /workspace/.ssh/known_hosts
        export GIT_SSH_COMMAND="ssh -i /workspace/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/workspace/.ssh/known_hosts"

        rm -rf audio-classification-playground
        git clone --branch feature/inference-optimization --single-branch git@github.com:dvirbenor/audio-classification-playground.git
        cd audio-classification-playground
        echo "Git commit: $(git rev-parse HEAD)"
        uv sync --frozen
        source .venv/bin/activate

        source env.shared.sh
        python -m audio_classification_playground.acoustic_events.orchestration run \
          --parquet "$PARQUET" \
          --output "$OUTPUT" \
          --task-group emotion \
          --emotion-runtime-mode optimized \
          --completion-policy exists \
          --affect-backbone wavlm \
          --disfluency-backbone wavlm \
          --device cuda \
          --vad-gating \
          --prefetch-workers 8 \
          --prefetch-lookahead 16 \
          --vad-prefetch-workers 0 \
          --max-retries 3 \
          --audio-cache-dir "$AUDIO_CACHE" \
          --max-cache-bytes "$CACHE_BYTES"

        echo "[$(date -Iseconds)] Finished inference-emotion-cache-vadgated run ${RUN_ID}"
    grid:
      run_id: [1, 2, 3, 4, 5, 6, 7, 8]

  # vad PRODUCES the intervals other tasks gate on; it is never gated itself.
  - name: inference-vad-cpu-cache
    category: inference
    description: Run CPU-only VAD acoustic-event inference with shared decoded-audio cache
    instanceTypes: ["c6a.4xlarge", "c7a.4xlarge", "c6i.4xlarge", "c7i.4xlarge"]
    ephemeralStorage: "10Gi"
    resources:
      requests:
        cpu: "13"
        memory: "24Gi"
      limits:
        cpu: "13"
        memory: "24Gi"
    cmd: /bin/bash
    args:
      - -lc
      - |
        set -euo pipefail

        export RUN_ID="{run_id}"
        export PYTHONUNBUFFERED=1
        export UV_LINK_MODE=copy

        PARQUET="/efs/dvir/data/magic-clips-research/dataset-reference/all_archives.parquet"
        OUTPUT="/efs/dvir/data/magic-clips-research/acoustic-understanding/models-inference"
        AUDIO_CACHE="${OUTPUT}/_meta/audio_cache"
        CACHE_BYTES=536870912000

        LOG_DIR="${OUTPUT}/job-logs"
        mkdir -p "$LOG_DIR"
        LOG_FILE="$LOG_DIR/inference-vad-cpu-cache-run-${RUN_ID}-${HOSTNAME:-unknown}.log"
        exec > >(tee -a "$LOG_FILE") 2>&1

        echo "[$(date -Iseconds)] Starting inference-vad-cpu-cache run ${RUN_ID}"
        cd /workspace

        mkdir -p /workspace/.ssh
        cp /mnt/github-ssh/id_ed25519 /workspace/.ssh/id_ed25519
        cp /mnt/github-ssh/known_hosts /workspace/.ssh/known_hosts
        chmod 700 /workspace/.ssh
        chmod 400 /workspace/.ssh/id_ed25519
        chmod 444 /workspace/.ssh/known_hosts
        export GIT_SSH_COMMAND="ssh -i /workspace/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/workspace/.ssh/known_hosts"

        rm -rf audio-classification-playground
        git clone --branch feature/inference-optimization --single-branch git@github.com:dvirbenor/audio-classification-playground.git
        cd audio-classification-playground
        echo "Git commit: $(git rev-parse HEAD)"
        uv sync --frozen
        source .venv/bin/activate

        source env.shared.sh
        python -m audio_classification_playground.acoustic_events.orchestration run \
          --parquet "$PARQUET" \
          --output "$OUTPUT" \
          --task-group vad \
          --completion-policy exists \
          --affect-backbone wavlm \
          --disfluency-backbone wavlm \
          --device cpu \
          --prefetch-workers 6 \
          --prefetch-lookahead 12 \
          --vad-prefetch-workers 1 \
          --max-retries 3 \
          --audio-cache-dir "$AUDIO_CACHE" \
          --max-cache-bytes "$CACHE_BYTES"

        echo "[$(date -Iseconds)] Finished inference-vad-cpu-cache run ${RUN_ID}"
    grid:
      run_id: [1, 2, 3, 4, 5, 6, 7, 8]
