# CPU job template for the VAD backfill, as a SINGLE multi-pod Job.
#
# Unlike job-template-with-github-ssh.yaml (one pod per Job, fanned out by the
# launcher's grid:), this sets spec.parallelism/completions so ONE Job runs N
# identical pods. The launcher deep-copies the template and never touches these
# fields, so they pass straight through (see rs_ai_training/manifest/builder.py).
#
# Safe for the vad backfill because the workers are interchangeable: they claim
# archives via per-archive file locks and each loops until no VAD work remains,
# then exits 0. There is no run_id-based work sharding, so N pods under one Job
# behave exactly like N single-pod Jobs — minus N-1 Job objects to track.
#
# POD COUNT = 3 (parallelism/completions below). Deliberately small: VAD throughput
# is EFS-metadata-bound, not per-pod-CPU-bound, so the aggregate rate plateaus well
# before 20 pods. A 20-pod run measured only ~80-110 arc/h/pod (~2k/h aggregate, EFS
# thrash) and OOM-failed, whereas a single pod hit ~660/h in isolation. A few pods
# stay near the per-pod ceiling without saturating EFS; scale up only if a real
# throughput measurement shows headroom.
#
# Keep the manifest's grid: at a single entry (run_id: [1]) when using this
# template; pod count is parallelism/completions here, NOT the grid.
#
# Launch:
#   experiment-launcher launch manifests/acoustic-events-vad-backfill.yaml \
#     --template ./manifests/job-template-vad-backfill-parallel.yaml
#
# This template is CPU-only and carries NO GPU nodeSelector/toleration/resource.
# The manifest's instanceTypes (CPU types) drives node selection onto the CPU
# pool via nodeAffinity, and its resources.requests replaces the container
# resources below wholesale.
apiVersion: batch/v1
kind: Job
metadata:
  name: template-job
  namespace: default
spec:
  parallelism: 5
  completions: 5
  # backoffLimit raised from 10: a single-pod OOM or node disruption shouldn't end
  # the whole backfill (the prior 20-pod run OOM-failed the Job). Workers loop-until-
  # no-work and coordinate via locks, so retries are safe. NOTE: 5 pods × 8 VAD procs
  # is above the measured ~3-pod sweet spot — VAD is EFS-metadata-bound, and a 20-pod
  # run thrashed EFS to ~80-110 arc/h/pod and OOMed. Watch for OOMKilled and falling
  # per-pod throughput (orchestration progress --fast); drop to 3 if so.
  backoffLimit: 200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: ml-experiment
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 600
      containers:
        - name: experiment-container
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          env: []
          volumeMounts:
            - name: ai-efs
              mountPath: /efs
            - name: shm
              mountPath: /dev/shm
            - name: github-ssh
              mountPath: /mnt/github-ssh
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: ai-efs
          persistentVolumeClaim:
            claimName: ai-efs-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 200Gi
        - name: github-ssh
          secret:
            secretName: audio-playground-github-ssh
            defaultMode: 256
