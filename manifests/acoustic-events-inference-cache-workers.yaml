  - name: inference-emotion-cache
    category: inference
    description: Run emotion acoustic-event inference on g5.4xlarge with shared decoded-audio cache
    nodeSelector:
      node.kubernetes.io/instance-type: g5.4xlarge
    cmd: /bin/bash
    args:
      - -lc
      - |
        set -euo pipefail

        export RUN_ID="{run_id}"
        export PYTHONUNBUFFERED=1
        export UV_LINK_MODE=copy
        export TMPDIR=/workspace/tmp
        mkdir -p "$TMPDIR"

        PARQUET="/efs/dvir/data/magic-clips-research/dataset-reference/all_archives.parquet"
        OUTPUT="/efs/dvir/data/magic-clips-research/acoustic-understanding/models-inference"
        AUDIO_CACHE="${OUTPUT}/_meta/audio_cache"
