        chmod 444 /workspace/.ssh/known_hosts
        export GIT_SSH_COMMAND="ssh -i /workspace/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/workspace/.ssh/known_hosts"

        rm -rf audio-classification-playground
        git clone --branch main --single-branch git@github.com:dvirbenor/audio-classification-playground.git
        cd audio-classification-playground
        echo "Git commit: $(git rev-parse HEAD)"
        uv sync --frozen
        source .venv/bin/activate

        source env.shared.sh
        python -m audio_classification_playground.acoustic_events.orchestration run \
          --parquet "$PARQUET" \
          --output "$OUTPUT" \
          --task-group vad \
          --completion-policy exists \
          --affect-backbone wavlm \
          --disfluency-backbone wavlm \
          --device cpu \
          --prefetch-workers 10 \
          --prefetch-lookahead 24 \
          --vad-prefetch-workers 1 \
          --max-retries 3 \
          --seed "$SEED" \
          --audio-cache-dir "$AUDIO_CACHE" \
          --max-cache-bytes "$CACHE_BYTES"

