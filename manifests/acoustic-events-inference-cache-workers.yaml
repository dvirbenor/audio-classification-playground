          --task-group emotion \
          --completion-policy exists \
          --affect-backbone wavlm \
          --disfluency-backbone wavlm \
          --device cuda \
          --prefetch-workers 14 \
          --prefetch-lookahead 28 \
          --vad-prefetch-workers 0 \
          --max-retries 3 \
          --seed "$SEED" \
          --audio-cache-dir "$AUDIO_CACHE" \
          --max-cache-bytes "$CACHE_BYTES"

        echo "[$(date -Iseconds)] Finished inference-emotion-cache run ${RUN_ID}"
    grid:
      run_id: [1, 2, 3, 4, 5, 6, 7, 8]

  - name: inference-vad-cpu-cache
    category: inference
    description: Run CPU-only VAD acoustic-event inference with shared decoded-audio cache
    instanceTypes: ["c6a.4xlarge", "c7a.4xlarge", "c6i.4xlarge", "c7i.4xlarge"]
    ephemeralStorage: "10Gi"
    resources:
      requests:
        cpu: "13"
        memory: "24Gi"
      limits:
        cpu: "13"
        memory: "24Gi"
    cmd: /bin/bash
    args:
      - -lc
