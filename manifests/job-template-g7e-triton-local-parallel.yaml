# Job template for g7e.4xlarge: 3 CPU workers + local Triton sidecar (Blackwell).
#
# Two containers per pod — both share the pod's host network (localhost):
#
#   experiment-container  (filled by experiment-launcher from the manifest)
#     Runs 3 orchestration workers in background, each --device cpu --triton-url localhost:8001
#     ~10 CPU, ~64 Gi, no GPU request
#
#   triton-sidecar  (static in this template, never modified by the launcher)
#     tritonserver loading TRT .plan engines for Blackwell (sm_120) from S3
#     ~4 CPU, ~24 Gi, 1 × B200 GPU
#     ready check: GET http://localhost:8000/v2/health/ready (polled by the worker)
#
# Total pod footprint on g7e.4xlarge (16 vCPU, 128 GB RAM, 1 × B200):
#   CPU: ~14 vCPU requested (leaves 2 for kubelet/system)
#   RAM: ~88 Gi requested
#   GPU: 1 B200 (held entirely by Triton; workers run --device cpu)
#
# POD COUNT = parallelism/completions below. SHARD_COUNT in the manifest MUST
# equal parallelism × workers_per_pod (6 pods × 3 workers = 18).
# completionMode: Indexed → each pod gets JOB_COMPLETION_INDEX (0..5), which
# the manifest script maps to shard indices (pod*3+0, pod*3+1, pod*3+2).
#
# Launch:
#   experiment-launcher launch manifests/acoustic-events-g7e-colocated.yaml \
#       --template ./manifests/job-template-g7e-triton-local-parallel.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: template-job
  namespace: default
spec:
  completionMode: Indexed
  parallelism: 6
  completions: 6
  backoffLimit: 200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: ml-experiment
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 600
      serviceAccountName: ai-dev-common-access
      nodeSelector:
        karpenter: ai-workers-gpu
        node.kubernetes.io/instance-type: g7e.4xlarge
        karpenter.sh/capacity-type: on-demand
      tolerations:
        - key: karpenter
          operator: Equal
          value: ai-workers-gpu
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        # Primary container — filled by experiment-launcher with the manifest's
        # image, args, env, and resources. Name must stay "experiment-container".
        - name: experiment-container
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          env: []
          volumeMounts:
            - name: ai-efs
              mountPath: /efs
            - name: shm
              mountPath: /dev/shm
            - name: github-ssh
              mountPath: /mnt/github-ssh
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi

        # Triton sidecar — serves Blackwell TRT engines (sm_120/GB202) via gRPC on localhost:8001.
        # The experiment-launcher never modifies containers whose name is not
        # "experiment-container", so this definition is stable across launches.
        - name: triton-sidecar
          image: nvcr.io/nvidia/tritonserver:25.07-py3
          imagePullPolicy: Always
          command: [tritonserver]
          args:
            - --model-repository=s3://riverside-build-assets/paralinguistics-trt/GB202
            - --grpc-port=8001
            - --http-port=8000
            - --metrics-port=8002
            - --allow-grpc=true
            - --allow-http=true
            - --model-control-mode=none
            - --log-verbose=0
          ports:
            - containerPort: 8001
              name: grpc
            - containerPort: 8000
              name: http
            - containerPort: 8002
              name: metrics
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "4"
              memory: "24Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: "32Gi"
              nvidia.com/gpu: "1"
          # Readiness gate: worker container polls this before starting its main loop.
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 24

      volumes:
        - name: ai-efs
          persistentVolumeClaim:
            claimName: ai-efs-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: github-ssh
          secret:
            secretName: audio-playground-github-ssh
            defaultMode: 256
