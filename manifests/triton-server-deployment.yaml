# Triton Inference Server — persistent Deployment + ClusterIP Service.
#
# Hosts three models on one g7e.2xlarge GPU:
#   affect      — WavLM ONNX, onnxruntime backend
#   disfluency  — WavLM ONNX, onnxruntime backend
#   emotion     — emotion2vec ONNX, onnxruntime backend
#
# Dynamic batching accumulates windows from many concurrent CPU workers,
# keeping the GPU full without MPS or torch.compile warmup.
#
# Models are read directly from S3 (s3://riverside-build-assets/paralinguistics).
#
# SETUP (run once before deploying workers):
#   1. Publish the models to S3 (on a GPU pod) — export, then sync the FP16
#      models + configs (exclude the FP32 reference files):
#        scripts/export_onnx.sh --output /efs/triton-model-repo
#        aws s3 sync /efs/triton-model-repo s3://riverside-build-assets/paralinguistics \
#            --exclude "*model_fp32.onnx" --exclude "*model.onnx.data"
#   2. Apply this file — uses the official Triton image, no custom build needed.
#      The pod's ServiceAccount must have S3 read on that prefix (see below):
#        kubectl apply -f manifests/triton-server-deployment.yaml \
#            -n nlp-audio-understanding
#   3. Verify models are loaded:
#        kubectl exec -n nlp-audio-understanding deploy/triton-inference -- \
#            curl -s localhost:8000/v2/models | python3 -m json.tool
#
# Image note: the official nvcr.io/nvidia/tritonserver image includes the
# onnxruntime backend, which serves all three models — no Python backend or
# custom build needed (so pod startup is instant; no funasr/modelscope install).
# The ONNX models are hardware-agnostic, so the same exported model.onnx files
# run on any GPU — only the server image's CUDA version gates the target GPU.
# For RTX PRO 6000 Blackwell (sm_120) the image must be >= 25.01 (CUDA 12.8+);
# see the image tag below.
#
# Workers connect via gRPC at:  triton-inference.nlp-audio-understanding:8001
# Workers connect via HTTP at:  triton-inference.nlp-audio-understanding:8000
#
# Apply with:  kubectl apply -f manifests/triton-server-deployment.yaml -n nlp-audio-understanding
# Delete with: kubectl delete -f manifests/triton-server-deployment.yaml -n nlp-audio-understanding
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton-inference
  namespace: nlp-audio-understanding
  labels:
    app: triton-inference
    team: nlp
    project: audio-understanding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triton-inference
  template:
    metadata:
      labels:
        app: triton-inference
    spec:
      # Tolerate GPU nodes
      tolerations:
        - key: karpenter
          operator: Equal
          value: ai-workers-gpu
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        # g7e nodes are Blackwell (sm_120) — the correct target for the
        # CUDA 12.8+ Triton image above. Do not change to L40S/Ada.
        node.kubernetes.io/instance-type: g7e.2xlarge

      # S3 model repository read access is inherited from the pod's existing AWS
      # authorization (node instance role / pod identity) — no serviceAccount
      # override needed. Requires s3:GetObject + s3:ListBucket on
      # arn:aws:s3:::riverside-build-assets (prefix paralinguistics/*).

      containers:
        - name: tritonserver
          # Must be a release built on CUDA 12.8+ for RTX PRO 6000 Blackwell
          # (sm_120). CUDA 12.8/Blackwell support landed in Triton 25.01; the
          # 24.x line (CUDA 12.6) has no sm_120 kernels and will fail to launch
          # on Blackwell. Bump to the latest tag your cluster has validated.
          image: nvcr.io/nvidia/tritonserver:25.05-py3
          imagePullPolicy: Always

          command:
            - tritonserver
          args:
            # Triton reads the model repository directly from S3: at startup it
            # copies the whole prefix (~1.7 GB of FP16 model.onnx + configs) into
            # a local temp dir, then loads. Needs AWS creds (serviceAccount/IRSA
            # below), AWS_DEFAULT_REGION, and enough ephemeral-storage (below).
            - --model-repository=s3://riverside-build-assets/paralinguistics
            - --log-verbose=1
            - --grpc-port=8001
            - --http-port=8000
            - --metrics-port=8002
            - --allow-grpc=true
            - --allow-http=true
            # Let Triton manage model loading; models are ready before the
            # service endpoint becomes live.
            - --model-control-mode=none

          ports:
            - containerPort: 8000  # HTTP
              name: http
            - containerPort: 8001  # gRPC — workers connect here
              name: grpc
            - containerPort: 8002  # Prometheus metrics
              name: metrics

          resources:
            requests:
              cpu: "6"
              memory: "32Gi"
              nvidia.com/gpu: "1"
              # Scratch for the localized S3 copy (~1.7 GB) + Triton temp.
              ephemeral-storage: "4Gi"
            limits:
              cpu: "8"
              memory: "48Gi"
              nvidia.com/gpu: "1"
              ephemeral-storage: "8Gi"

          env:
            # Region for the S3 model-repository backend (bucket is us-east-1).
            - name: AWS_DEFAULT_REGION
              value: us-east-1

          volumeMounts:
            - name: dshm
              mountPath: /dev/shm

          # Gate traffic until Triton reports all three models ready. Timings
          # allow for the cold-start S3 download (~1.7 GB) + loading three ONNX
          # models onto the GPU before liveness can restart the pod.
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: 8000
            initialDelaySeconds: 240
            periodSeconds: 20
            failureThreshold: 6

      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi

---
apiVersion: v1
kind: Service
metadata:
  name: triton-inference
  namespace: nlp-audio-understanding
  labels:
    app: triton-inference
spec:
  selector:
    app: triton-inference
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: grpc
      port: 8001
      targetPort: 8001
    - name: metrics
      port: 8002
      targetPort: 8002
