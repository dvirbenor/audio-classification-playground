# Job template for g5.8xlarge: CPU worker + local Triton sidecar, single multi-pod Job.
#
# Two containers per pod — both share the pod's host network (localhost):
#
#   experiment-container  (filled by experiment-launcher from the manifest)
#     CPU-only orchestration worker: --device cpu --triton-url localhost:8001
#     ~24 CPU, ~40 Gi, no GPU request
#
#   triton-sidecar  (static in this template, never modified by the launcher)
#     tritonserver loading TRT engines for A10G from S3
#     ~6 CPU, ~20 Gi, 1 × A10G GPU
#     ready check: GET http://localhost:8000/v2/health/ready (polled by the worker)
#
# Total pod footprint on g5.8xlarge (32 vCPU, 128 GB RAM, 1 × A10G):
#   CPU: ~30 vCPU (leaves 2 for kubelet/system)
#   RAM: ~60 Gi
#   GPU: 1 A10G (held entirely by Triton; worker runs --device cpu)
#
# IRSA / S3 access: serviceAccountName ai-dev-common-access grants the pod
# read access to s3://riverside-build-assets/paralinguistics-trt/A10G so the
# Triton sidecar can pull model engines at startup.
#
# POD COUNT = parallelism/completions below. Keep SHARD_COUNT in the manifest
# equal to this number so the worklist shards tile correctly.
# completionMode: Indexed → each pod gets JOB_COMPLETION_INDEX (0..N-1), which
# the worker uses as --shard-index to claim a disjoint work slice.
#
# Launch:
#   experiment-launcher launch manifests/acoustic-events-g5-colocated.yaml \
#       --template ./manifests/job-template-g5-triton-local-parallel.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: template-job
  namespace: default
spec:
  completionMode: Indexed
  parallelism: 5
  completions: 5
  backoffLimit: 200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: ml-experiment
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 600
      serviceAccountName: ai-dev-common-access
      nodeSelector:
        karpenter: ai-workers-gpu
        node.kubernetes.io/instance-type: g5.8xlarge
        karpenter.sh/capacity-type: on-demand
      tolerations:
        - key: karpenter
          operator: Equal
          value: ai-workers-gpu
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        # Primary container — filled by experiment-launcher with the manifest's
        # image, args, env, and resources. Name must stay "experiment-container".
        - name: experiment-container
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          env: []
          volumeMounts:
            - name: ai-efs
              mountPath: /efs
            - name: shm
              mountPath: /dev/shm
            - name: github-ssh
              mountPath: /mnt/github-ssh
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi

        # Triton sidecar — serves TRT engines for A10G via gRPC on localhost:8001.
        # The experiment-launcher never modifies containers whose name is not
        # "experiment-container", so this definition is stable across launches.
        - name: triton-sidecar
          image: nvcr.io/nvidia/tritonserver:25.07-py3
          imagePullPolicy: Always
          command: [tritonserver]
          args:
            - --model-repository=s3://riverside-build-assets/paralinguistics-trt/A10G
            - --grpc-port=8001
            - --http-port=8000
            - --metrics-port=8002
            - --allow-grpc=true
            - --allow-http=true
            - --model-control-mode=none
            - --log-verbose=0
          ports:
            - containerPort: 8001
              name: grpc
            - containerPort: 8000
              name: http
            - containerPort: 8002
              name: metrics
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "6"
              memory: "20Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: "28Gi"
              nvidia.com/gpu: "1"
          # Readiness gate: worker container polls this before starting its main loop.
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 24

      volumes:
        - name: ai-efs
          persistentVolumeClaim:
            claimName: ai-efs-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: github-ssh
          secret:
            secretName: audio-playground-github-ssh
            defaultMode: 256
